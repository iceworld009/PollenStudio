name: Build releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check source
        run: |
          python -m compileall -q studio capture.py launch_studio.py
          bash -n Setup-Linux.sh Start-Linux.sh packaging/setup-linux.sh
      - name: Build platform packages
        run: python packaging/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: PollenStudio-packages
          path: dist/*
      - name: Publish release downloads
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Pollen Studio $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
